# Standalone (empty [workspace] keeps it out of the parent workspace): prints the
# canonical TTSConfig as JSON so `pocket_tts --config` can drive a local GGUF.
[workspace]

[package]
name = "dump-config"
version = "0.0.0"
edition = "2024"

[dependencies]
ptts = { path = "../../../ptts" }
serde_json = "1"
