[package]
name = "phonon-cli"
version.workspace = true
edition = "2024"
description = "Phonon: fast local text-to-speech on the command line. Installs the `phonon` binary."
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
# The point of this crate is `cargo install phonon-cli`, so keep it a binary
# only: no library target for anyone to depend on by accident. The crate is
# `phonon-cli` because crates.io `phonon` is taken by an unrelated audio crate
# (a Steam Audio port); the binary it installs is `phonon`, which is the part
# anyone actually types.
autolib = false

[[bin]]
name = "phonon"
path = "src/main.rs"

[dependencies]
ptts = { workspace = true, features = ["sp", "hub", "audio"] }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xn = { workspace = true }

[features]
default = []
cuda = ["xn/cuda", "ptts/cuda"]
vulkan = ["xn/vulkan", "ptts/vulkan"]
metal = ["xn/metal", "ptts/metal"]
accelerate = ["xn/accelerate", "ptts/accelerate"]
