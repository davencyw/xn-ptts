<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phonon</title>
<style>
  /* Tokens on bare :root are the light palette; the dark block below only
     redefines them, so every colour has a definition in both themes. */
  :root {
    --bg: #fcfcfd;
    --surface: #f3f4f6;
    --text: #16181d;
    --muted: #6b7280;
    --faint: #d3d6dc;
    --accent: #3b5bdb;
    --accent-text: #ffffff;
    --meter: #3b5bdb;
    --meter-off: #e6e8ec;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0d10;
      --surface: #16181d;
      --text: #e8eaed;
      --muted: #8b929e;
      --faint: #2a2d35;
      --accent: #7c93f5;
      --accent-text: #0c0d10;
      --meter: #7c93f5;
      --meter-off: #1c1f26;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* The page is a single screen: nothing here should ever need scrolling, so
     the shell is exactly the viewport tall and the meter takes whatever space
     the controls leave. `dvh` rather than `vh` so mobile browser chrome
     collapsing does not cut the bottom off. */
  html, body { height: 100%; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    max-width: 42rem;
    margin: 0 auto;
    min-height: 100dvh;
    max-height: 100dvh;
    padding: clamp(1.25rem, 4vh, 2.5rem) 1.25rem clamp(1rem, 3vh, 1.75rem);
    display: flex;
    flex-direction: column;
    gap: clamp(0.75rem, 2vh, 1.25rem);
    overflow: hidden;
  }

  /* ---- masthead ---- */
  header {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    flex: none;
  }
  /* The mark is a solid black tile with no alpha, so it would sink into the
     dark background unaided: the hairline ring keeps its edge legible in both
     themes and reads as an icon rather than a stray square. */
  #logo {
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 6px;
    border: 1px solid var(--faint);
    flex: none;
  }
  .wordmark {
    font-size: 1.75rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .tagline { color: var(--muted); font-size: 0.9375rem; }
  .tagline a { color: inherit; text-decoration: underline; text-decoration-color: var(--faint); text-underline-offset: 2px; }
  .tagline a:hover { text-decoration-color: var(--accent); }

  /* ---- form ---- */
  #controls {
    display: flex;
    flex-direction: column;
    gap: clamp(0.625rem, 1.8vh, 1rem);
    flex: none;
  }
  /* Needed, and not redundant: the `hidden` attribute works through the UA
     stylesheet's `display: none`, which an author-level `display: flex` above
     outranks. Without this the controls stay visible and clickable before the
     model is loaded. */
  #controls[hidden] { display: none; }
  .field { min-width: 0; }
  label {
    display: block;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 0.375rem;
  }
  textarea, select, button, input { font: inherit; }
  textarea {
    width: 100%;
    padding: 0.75rem 0.875rem;
    border: 1px solid var(--faint);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    resize: vertical;
    font-size: 1rem;
  }
  select {
    width: 100%;
    padding: 0.625rem 0.875rem;
    border: 1px solid var(--faint);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9375rem;
  }
  textarea:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .row { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; align-items: end; }

  .temp-row { display: flex; align-items: center; gap: 0.75rem; }
  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    background: transparent;
  }
  .slider-value {
    color: var(--text);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
    min-width: 2ch;
  }

  button {
    width: 100%;
    padding: 0.8125rem 1.25rem;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: var(--radius);
    font-size: 0.9375rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover:not(:disabled) { opacity: 0.88; }
  button:disabled { background: var(--surface); color: var(--muted); cursor: not-allowed; }

  /* ---- output ---- */
  .progress-bar {
    width: 100%;
    height: 2px;
    background: var(--faint);
    border-radius: 1px;
    overflow: hidden;
    flex: none;
  }
  .progress-bar .fill { height: 100%; background: var(--accent); transition: width 0.2s; }

  #status {
    flex: none;
    font-size: 0.8125rem;
    line-height: 1.6;
    color: var(--muted);
    white-space: pre-wrap;
    font-variant-numeric: tabular-nums;
  }
  #status:empty { display: none; }

  #visualizer {
    width: 100%;
    display: block;
    flex: 1 1 auto;
    min-height: 3rem;
  }

  #audio-container { flex: none; }
  #audio-container:empty { display: none; }
  audio { width: 100%; display: block; }
</style>
</head>
<body>

<header>
  <img id="logo" src="logo.png" alt="Gradium" width="28" height="28">
  <div class="wordmark">Phonon</div>
</header>

<button id="load-btn">Load model (136 MB)</button>

<!-- Everything here needs the model, so it stays hidden until the model is in.
     The voice list is filled in from the loaded checkpoint. -->
<div id="controls" hidden>
  <div class="field">
    <label for="text">Text</label>
    <textarea id="text" rows="2">Phonon runs entirely on your device. No server, no account, no waiting.</textarea>
  </div>

  <div class="row">
    <div class="field">
      <label for="voice">Voice</label>
      <select id="voice"></select>
    </div>
    <div class="field">
      <label for="temperature">Expressiveness</label>
      <div class="temp-row">
        <input type="range" id="temperature" min="0.1" max="1.0" step="0.1" value="0.7">
        <span id="temp-value" class="slider-value">0.7</span>
      </div>
    </div>
  </div>

  <button id="generate-btn">Generate</button>
</div>

<div class="progress-bar" id="progress-bar" style="display:none"><div class="fill" id="progress-fill"></div></div>
<div id="status"></div>
<canvas id="visualizer"></canvas>
<div id="audio-container"></div>

<script type="module">
const statusEl = document.getElementById('status');
const controls = document.getElementById('controls');
const loadBtn = document.getElementById('load-btn');
const btn = document.getElementById('generate-btn');
const voiceSelect = document.getElementById('voice');
const progressBar = document.getElementById('progress-bar');
const progressFill = document.getElementById('progress-fill');
const canvas = document.getElementById('visualizer');
const canvasCtx = canvas.getContext('2d');
const tempSlider = document.getElementById('temperature');
const tempValue = document.getElementById('temp-value');

tempSlider.addEventListener('input', () => {
  tempValue.textContent = tempSlider.value;
});


function log(msg) {
  statusEl.textContent = msg;
  console.log(msg);
}

function showProgress(pct) {
  progressBar.style.display = 'block';
  progressFill.style.width = pct + '%';
}

function hideProgress() {
  progressBar.style.display = 'none';
}

// ---- Visualizer ----
let analyser = null;
let animFrameId = null;

const BAR_COUNT = 32;
const SEG_COUNT = 16;
const SEG_GAP = 2;

function resizeCanvas() {
  canvas.width = canvas.clientWidth * devicePixelRatio;
  canvas.height = canvas.clientHeight * devicePixelRatio;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// The meter reads its colours from the stylesheet so it follows the theme
// instead of pinning a dark-only palette. Re-read on every frame batch is
// wasteful, so cache and refresh only when the colour scheme changes.
let themeColors = readThemeColors();
function readThemeColors() {
  const cs = getComputedStyle(document.documentElement);
  return {
    bg: cs.getPropertyValue('--bg').trim() || '#0c0d10',
    meter: cs.getPropertyValue('--meter').trim() || '#7c93f5',
    off: cs.getPropertyValue('--meter-off').trim() || '#1c1f26',
  };
}
matchMedia('(prefers-color-scheme: dark)')
  .addEventListener('change', () => { themeColors = readThemeColors(); });

// One accent hue, fading toward the top of the bar: quieter than a
// red/amber/green ladder and it carries the same amplitude information.
// Applied via globalAlpha rather than a color-mix() fillStyle, because an
// unsupported colour function makes the assignment a silent no-op and the
// whole meter then draws in whatever colour was set last.
function segmentAlpha(segIndex, totalSegs) {
  const t = segIndex / (totalSegs - 1); // 0 = bottom, 1 = top
  return 1 - t * 0.45;
}

function makeAnalyser(ctx) {
  const a = ctx.createAnalyser();
  a.fftSize = 1024;
  a.minDecibels = -90;
  a.maxDecibels = -10;
  a.smoothingTimeConstant = 0.5;
  return a;
}

function drawBars() {
  animFrameId = requestAnimationFrame(drawBars);

  const w = canvas.width;
  const h = canvas.height;
  canvasCtx.fillStyle = themeColors.bg;
  canvasCtx.fillRect(0, 0, w, h);

  if (!analyser) return;

  const freqData = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(freqData);

  const barWidth = Math.floor(w / BAR_COUNT);
  const gap = 2 * devicePixelRatio;
  const innerBarW = barWidth - gap;
  const segH = Math.floor(h / SEG_COUNT);
  const segGap = SEG_GAP * devicePixelRatio;
  const innerSegH = segH - segGap;

  // Use only the lower half of the spectrum (most relevant for speech)
  const usableBins = Math.floor(freqData.length / 2);
  const binsPerBar = Math.max(1, Math.floor(usableBins / BAR_COUNT));

  for (let i = 0; i < BAR_COUNT; i++) {
    // Peak (not average) of the frequency bins for this bar — more visible
    let peak = 0;
    const startBin = i * binsPerBar;
    for (let b = 0; b < binsPerBar; b++) {
      peak = Math.max(peak, freqData[startBin + b]);
    }
    const litSegs = Math.round((peak / 255) * SEG_COUNT);

    const x = i * barWidth + gap / 2;

    canvasCtx.fillStyle = themeColors.meter;
    for (let s = 0; s < litSegs; s++) {
      const y = h - (s + 1) * segH + segGap / 2;
      canvasCtx.globalAlpha = segmentAlpha(s, SEG_COUNT);
      canvasCtx.fillRect(x, y, innerBarW, innerSegH);
    }
    canvasCtx.globalAlpha = 1;

    // Draw dim segments above the lit ones
    for (let s = litSegs; s < SEG_COUNT; s++) {
      const y = h - (s + 1) * segH + segGap / 2;
      canvasCtx.fillStyle = themeColors.off;
      canvasCtx.fillRect(x, y, innerBarW, innerSegH);
    }
  }
}

function startVisualizer() {
  if (animFrameId) cancelAnimationFrame(animFrameId);
  drawBars();
}

function stopVisualizer() {
  // The analyser naturally returns zeros when no audio is playing
}

// ---- Worker setup ----
const worker = new Worker('worker.js', { type: 'module' });

let sampleRate = 24000;
let audioCtx = null;
let lastWavUrl = null;

// Each live AudioContext holds a real-time audio render thread, and browsers cap
// how many one page may have (Safari 4, Chrome 6). Creating one per generation
// without closing the old one eventually refuses to construct at all, which in a
// demo means the Generate button simply stops producing sound.
function closeAudioContext(ctx) {
  if (ctx && ctx.state !== 'closed') ctx.close().catch(() => {});
}
let nextStartTime = 0;
let startTime = 0;
let firstChunkTime = null;
let allChunks = [];
let generating = false;
let modelReady = false;
let replayAudioCtx = null;
let replaySource = null;

worker.onmessage = (e) => {
  const { type, ...data } = e.data;

  switch (type) {
    case 'status':
      log(data.message);
      break;

    case 'progress':
      // The bar carries the progress; the label just says what is happening.
      log(data.label.startsWith('Voice') ? 'Preparing voices\u2026' : 'Downloading\u2026');
      if (data.pct >= 0) showProgress(data.pct);
      break;

    case 'progress_done':
      hideProgress();
      break;

    case 'loaded':
      sampleRate = data.sampleRate;
      modelReady = true;
      loadBtn.style.display = 'none';
      // Voices belong to the checkpoint, so the list arrives with it.
      voiceSelect.innerHTML = (data.voices ?? [])
        .map((v, i) => `<option value="${v}"${i === 0 ? ' selected' : ''}>${v}</option>`)
        .join('');
      controls.hidden = false;
      log('');
      break;

    case 'gen_start':
      log('Generating\u2026');
      break;

    case 'chunk': {
      const chunk = new Float32Array(data.data);
      if (!firstChunkTime) {
        firstChunkTime = performance.now() - startTime;
        nextStartTime = audioCtx.currentTime;
      }

      nextStartTime = Math.max(nextStartTime, audioCtx.currentTime);

      const buf = audioCtx.createBuffer(1, chunk.length, sampleRate);
      buf.getChannelData(0).set(chunk);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(analyser);
      src.start(nextStartTime);
      nextStartTime += chunk.length / sampleRate;

      allChunks.push(chunk);
      break;
    }

    case 'done': {
      log('');

      // Create WAV download/replay element
      const allPcm = concatenateChunks(allChunks);
      const wavBlob = encodeWav(allPcm, sampleRate);
      if (lastWavUrl) URL.revokeObjectURL(lastWavUrl);
      const url = URL.createObjectURL(wavBlob);
      lastWavUrl = url;
      const container = document.getElementById('audio-container');
      container.innerHTML = '';
      const audio = document.createElement('audio');
      audio.controls = true;
      audio.src = url;
      container.appendChild(audio);
      hookAudioElement(audio);

      btn.disabled = false;
      generating = false;
      break;
    }

    case 'error':
      log('Error: ' + data.message);
      console.error(data.message);
      btn.disabled = false;
      generating = false;
      break;
  }
};

function hookAudioElement(audio) {
  // Set up the audio graph eagerly so it's ready when the user hits play
  closeAudioContext(replayAudioCtx);
  replayAudioCtx = new AudioContext({ sampleRate });
  const replayAnalyser = makeAnalyser(replayAudioCtx);
  replaySource = replayAudioCtx.createMediaElementSource(audio);
  replaySource.connect(replayAnalyser);
  replayAnalyser.connect(replayAudioCtx.destination);

  audio.addEventListener('play', () => {
    if (replayAudioCtx.state === 'suspended') replayAudioCtx.resume();
    analyser = replayAnalyser;
    startVisualizer();
  });
}

function concatenateChunks(chunks) {
  const totalLength = chunks.reduce((sum, c) => sum + c.length, 0);
  const result = new Float32Array(totalLength);
  let offset = 0;
  for (const chunk of chunks) {
    result.set(chunk, offset);
    offset += chunk.length;
  }
  return result;
}

function loadWeights() {
  loadBtn.disabled = true;
  worker.postMessage({ type: 'load' });
}

function generate() {
  const text = document.getElementById('text').value.trim();
  if (!text || generating || !modelReady) return;

  generating = true;
  btn.disabled = true;
  startTime = performance.now();
  firstChunkTime = null;
  allChunks = [];

  // This generation supersedes the previous one's playback context.
  closeAudioContext(audioCtx);
  replaySource = null;

  // AudioContext must be created/resumed from a user gesture
  audioCtx = new AudioContext({ sampleRate });
  analyser = makeAnalyser(audioCtx);
  analyser.connect(audioCtx.destination);
  startVisualizer();

  worker.postMessage({
    type: 'generate',
    text,
    voiceName: voiceSelect.value,
    temperature: parseFloat(tempSlider.value),
  });
}

function encodeWav(samples, sampleRate) {
  const numChannels = 1;
  const bitsPerSample = 16;
  const byteRate = sampleRate * numChannels * bitsPerSample / 8;
  const blockAlign = numChannels * bitsPerSample / 8;
  const dataSize = samples.length * blockAlign;
  const buffer = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buffer);

  function writeString(offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataSize, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, byteRate, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, bitsPerSample, true);
  writeString(36, 'data');
  view.setUint32(40, dataSize, true);

  let offset = 44;
  for (let i = 0; i < samples.length; i++) {
    let s = Math.max(-1, Math.min(1, samples[i]));
    s = s < 0 ? s * 0x8000 : s * 0x7FFF;
    view.setInt16(offset, s, true);
    offset += 2;
  }

  return new Blob([buffer], { type: 'audio/wav' });
}

loadBtn.addEventListener('click', loadWeights);
btn.addEventListener('click', generate);

// Start the render loop (draws empty bars until audio plays)
startVisualizer();
</script>
</body>
</html>
