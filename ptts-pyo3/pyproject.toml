[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ptts"
description = "Pocket TTS: text to 24 kHz speech, on device"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["tts", "text-to-speech", "speech-synthesis", "on-device"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["numpy"]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/LaurentMazare/xn-ptts"

[project.optional-dependencies]
test = ["pytest"]

[tool.maturin]
features = ["pyo3/extension-module"]
# Mixed layout: the compiled module is `ptts._ptts`, and `python/ptts/` adds the
# re-exporting `__init__.py`, the type stubs and `python -m ptts`.
python-source = "python"
module-name = "ptts._ptts"

[tool.pytest.ini_options]
testpaths = ["tests"]
