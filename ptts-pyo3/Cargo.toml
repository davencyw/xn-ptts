[package]
name = "ptts-pyo3"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
name = "_ptts"
crate-type = ["cdylib"]

[dependencies]
xn = { workspace = true }
# `hub` gives `TTS()` its default download path; `sp`/`hf` read the
# checkpoint's tokenizer.
ptts = { workspace = true, features = ["sp", "hf", "hub"] }
numpy = "0.28"
pyo3 = { version = "0.28", features = ["extension-module"] }

[features]
default = []
cuda = ["xn/cuda", "ptts/cuda"]
vulkan = ["xn/vulkan", "ptts/vulkan"]
metal = ["xn/metal", "ptts/metal"]
webgpu = ["xn/webgpu", "ptts/webgpu"]
accelerate = ["xn/accelerate", "ptts/accelerate"]
