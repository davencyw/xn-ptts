[package]
name = "ptts"
version.workspace = true
edition = "2024"
autoexamples = false
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
xn = { workspace = true }
ebur128 = { workspace = true }
rand = { workspace = true, features = ["std_rng"] }
rand_distr = { workspace = true }
safetensors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Optional: `half` for the bf16 GPU paths, `hf-hub` for `ModelSource::Hub`
# (pulls in ureq, so it must stay out of the wasm build), and one of
# `sentencepiece` / `tokenizers` for loading a tokenizer from a checkpoint.
half = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
sentencepiece = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
# Also optional `[dependencies]` above; listed here so the examples build
# regardless of which library features are enabled.
half = { workspace = true }
hf-hub = { workspace = true }
libc = { workspace = true }
rubato = { workspace = true }
symphonia = { workspace = true }
tracing-chrome = { workspace = true }

[features]
default = []
cuda = ["xn/cuda", "dep:half"]
vulkan = ["xn/vulkan"]
metal = ["xn/metal", "dep:half"]
webgpu = ["xn/webgpu"]
accelerate = ["xn/accelerate"]
# Download checkpoints from the Hugging Face Hub.
hub = ["dep:hf-hub"]
# Tokenizer backends: `sp` reads `tokenizer.model`, `hf` reads `tokenizer.json`.
sp = ["dep:sentencepiece"]
hf = ["dep:tokenizers"]

[[example]]
name = "say"
required-features = ["sp", "hub"]

[[example]]
name = "pocket_tts"
required-features = ["sp", "hub"]

[[example]]
name = "quantize"

[[example]]
name = "create_voice"
